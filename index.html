<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FísicaMente</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F4;--surface:#fff;--ink:#12262B;--mute:#5B6E73;--line:#D3DEE0;--court:#0E6B6B;--court-ink:#fff;--mark:#F2C230;--alert:#C0392B;--r:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A1D;--surface:#13272B;--ink:#E8F0F1;--mute:#93A8AC;--line:#244047;--court:#3FB5B0;--court-ink:#06201F;--alert:#FF7A66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1A1D;--surface:#13272B;--ink:#E8F0F1;--mute:#93A8AC;--line:#244047;--court:#3FB5B0;--court-ink:#06201F;--alert:#FF7A66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;margin:0;letter-spacing:-.02em}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--court);color:var(--court-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font:800 22px "Bricolage Grotesque",sans-serif;padding:0 10px 18px;letter-spacing:-.03em}
.brand span{border-bottom:4px solid var(--mark)}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-weight:600;opacity:.85}
nav button:hover{opacity:1;background:rgba(255,255,255,.12)}
nav button[aria-current=page]{background:var(--court-ink);color:var(--court);opacity:1}
nav .who{margin-top:auto;font-size:13px;opacity:.85;padding:0 10px}
main{padding:28px clamp(16px,4vw,44px);max-width:1040px;width:100%}
.sub{color:var(--mute);margin:4px 0 22px}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.num{font:800 40px/1 "Bricolage Grotesque",sans-serif}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btn{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--court);color:var(--court-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--court);color:var(--court-ink)}
.crit{display:grid;grid-template-columns:120px 1fr 38px;gap:10px;align-items:center;margin:10px 0}
.crit input[type=range]{padding:0;accent-color:var(--court);width:100%}
.crit b{text-align:right;font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.tag.down{color:var(--alert);border-color:var(--alert)}
.tag.up{color:var(--court);border-color:var(--court)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:6px 8px;text-align:center;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td input{width:62px;text-align:center}
svg text{fill:var(--mute);font:11px "Public Sans",sans-serif}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--surface)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed=false]{opacity:.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20}
.app.out{display:block}.login{max-width:440px;margin:12vh auto 0}.login .btn{width:100%;margin-top:10px}.bar{position:relative;height:10px;background:var(--bg);border-radius:6px}.bar i{display:block;height:100%;border-radius:6px}.bar u{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
@media print{nav,.noprint,.toast{display:none!important}.app{display:block}:root:root:root{--bg:#fff;--surface:#fff;--ink:#000;--mute:#444;--line:#ccc}.card{border:0}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:5;top:0}.brand,.who{display:none}nav button{white-space:nowrap}.crit{grid-template-columns:90px 1fr 34px}}
@media (prefers-reduced-motion:no-preference){main>section{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
:root{--bg:#F4F5F6;--surface:#fff;--ink:#1D2125;--mute:#6B7480;--line:#E6E9EC;--court:#1D2125;--court-ink:#fff;--mark:#FF5A36;--alert:#D6332A;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--surface:#181B1E;--ink:#ECEEF0;--mute:#9AA3AD;--line:#2A2F34;--court:#ECEEF0;--court-ink:#101214;--alert:#FF7A6E}.logo{filter:invert(1)}}
:root[data-theme="dark"]{--bg:#101214;--surface:#181B1E;--ink:#ECEEF0;--mute:#9AA3AD;--line:#2A2F34;--court:#ECEEF0;--court-ink:#101214;--alert:#FF7A6E}
h1,h2,h3,.num{font-family:Montserrat,"Public Sans",sans-serif;letter-spacing:-.02em}
h1{font-size:34px;font-weight:700}.num{font-size:44px;font-weight:700}
nav{background:var(--surface);color:var(--ink);border-right:1px solid var(--line);padding:24px 16px}
nav button{border-radius:999px;opacity:1;color:var(--mute);padding:10px 16px}nav button:hover{background:var(--bg);color:var(--ink)}nav button[aria-current=page]{background:var(--court);color:var(--court-ink)}nav .who{color:var(--mute);opacity:1}
.brand{padding:0 4px 22px}.brand img{height:84px;width:auto;display:block}
.btn{border-radius:999px;padding:11px 22px}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--bg)}
.card{box-shadow:0 1px 2px rgba(16,24,40,.05)}select,input,textarea{border-radius:12px}.seg{border-radius:999px}.tag.up{color:#1B8A5A;border-color:#1B8A5A}
.login{max-width:480px;text-align:center;padding:40px 32px}.login .logo{height:170px;max-width:100%}
dialog{border:0;border-radius:22px;padding:26px;width:min(440px,92vw);background:var(--surface);color:var(--ink)}dialog::backdrop{background:rgba(10,14,18,.55)}.fl{display:grid;gap:6px;margin-top:12px;font-weight:600;font-size:13px}.fl input,.fl select{width:100%}
@media (max-width:760px){.brand{display:none}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Principal">
<div class="brand"><img id="lg" class="logo" alt="FísicaMente"></div>
<button data-v="painel">Painel</button>
<button data-v="avaliar">Avaliar</button>
<button data-v="alunos">Alunos</button>
<button data-v="evolucao">Evolução</button>
<button data-v="relatorio">Relatório</button>
<button data-v="turmas">Visão geral</button>
<button data-v="cadturmas">Turmas</button>
<button data-v="professores">Professores</button>
<div class="who" id="who"></div>
</nav>
<main id="main"></main>
</div>
<script>
const CR=[["coordenacao","Coordenação"],["equilibrio","Equilíbrio"],["forca","Força"],["lateralidade","Lateralidade"],["flexibilidade","Flexibilidade"],["participacao","Participação"],["velocidade","Velocidade"]];
const COL=["#0E6B6B","#E08A00","#7A4FD1","#C0392B","#2E86DE","#2E9E5B","#B5379A"];
const TODAY="2026-10-17",PERIOD="2026-10";
const classes=[{id:"a",name:"6º ano A",students:["Ana Beatriz","Caio Mendes","Débora Lima","Enzo Rocha","Fernanda Alves"]},{id:"b",name:"7º ano B",students:["Gabriel Souza","Helena Prado","Igor Matos","Júlia Nunes","Kauê Ribeiro"]}];
const students=[];classes.forEach(c=>c.students.forEach((n,i)=>students.push({id:c.id+i,name:n,classId:c.id})));
let evals=[];
(function seed(){let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
students.forEach(st=>{const base=CR.map(()=>2+r()*1.5),trend=CR.map(()=>(r()-.25)*.5);
["2026-03-12","2026-06-18","2026-09-10"].forEach((d,k)=>{const v={};CR.forEach(([key],i)=>{v[key]=Math.min(5,Math.max(1,Math.round((base[i]+trend[i]*k+(r()-.5)*.6)*2)/2))});
evals.push({student:st.id,date:d,data:v,strengths:k===2?"Boa coordenação nos jogos coletivos e muito engajamento nas aulas.":"",toDevelop:k===2?"Trabalhar equilíbrio e flexibilidade com circuitos curtos.":""})})});
const s0=students[1];evals.filter(e=>e.student===s0.id&&e.date==="2026-09-10").forEach(e=>{e.data.equilibrio=Math.max(1,e.data.equilibrio-1.5)})})();
const $=s=>document.querySelector(s),fmt=n=>n.toFixed(1).replace(".",","),dt=d=>d.split("-").reverse().join("/").slice(0,5);
const stuName=id=>students.find(s=>s.id===id).name,clsName=id=>classes.find(c=>c.id===id).name;
const hist=id=>evals.filter(e=>e.student===id).sort((a,b)=>a.date.localeCompare(b.date));
const avg=d=>CR.reduce((a,[k])=>a+d[k],0)/CR.length;
const done=id=>evals.some(e=>e.student===id&&e.date.startsWith(PERIOD));
function alerts(){const out=[];students.forEach(s=>{const h=hist(s.id);if(h.length<2)return;const a=h[h.length-2].data,b=h[h.length-1].data;
CR.forEach(([k,l])=>{if(b[k]-a[k]<=-1)out.push({s,l,from:a[k],to:b[k]})})});return out}
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
let view="painel",mode="aluno",selStu=students[0].id,selCls="a",hidden=new Set();
function go(v){view=v;document.querySelectorAll("nav button[data-v]").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v===v)||b.removeAttribute("aria-current"));
document.querySelectorAll("nav button[data-v]").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
$("#main").innerHTML="<section>"+({painel,avaliar,evolucao,relatorio,turmas,alunos,cadturmas,professores}[v])()+"</section>";bind();window.scrollTo(0,0)}
function painel(){const pend=students.filter(s=>!done(s.id)),al=alerts();
return`<h1>Painel</h1><p class="sub">Outubro de 2026 · acompanhe quem já foi avaliado e quem precisa de atenção.</p>
<div class="grid g3"><div class="card"><div class="num">${students.length}</div><div class="mute">alunos em ${classes.length} turmas</div></div>
<div class="card"><div class="num">${students.length-pend.length}</div><div class="mute">avaliados neste mês</div></div>
<div class="card"><div class="num">${al.length}</div><div class="mute">quedas de 1 ponto ou mais</div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Pendentes</h2><p class="mute">Sem avaliação em outubro.</p>
${pend.length?`<ul class="list">${pend.map(s=>`<li><span>${s.name}<br><span class="mute">${clsName(s.classId)}</span></span>${user==="coordenador"?"":`<button class="btn ghost" data-ev="${s.id}">Avaliar</button>`}</li>`).join("")}</ul>`:`<p>Tudo em dia. Nenhum aluno pendente.</p>`}</div>
<div class="card"><h2>Atenção pedagógica</h2><p class="mute">Queda entre as duas últimas avaliações.</p>
${al.length?`<ul class="list">${al.map(a=>`<li><span>${a.s.name}<br><span class="mute">${a.l}: ${fmt(a.from)} para ${fmt(a.to)}</span></span><button class="btn ghost" data-ch="${a.s.id}">Ver evolução</button></li>`).join("")}</ul>`:`<p>Nenhuma queda relevante.</p>`}</div></div>
<div class="row" style="margin-top:18px"><button class="btn ghost" id="csv">Exportar tudo em CSV</button></div>`}
function sliderRow([k,l],v){return`<div class="crit"><label for="r_${k}">${l}</label><input type="range" id="r_${k}" min="1" max="5" step="0.5" value="${v}" data-k="${k}"><b id="o_${k}">${fmt(v)}</b></div>`}
function avaliar(){return`<h1>Avaliar</h1><p class="sub">Notas de 1 a 5, de meio em meio ponto.</p>
<div class="seg" role="group" aria-label="Modo"><button data-m="aluno" aria-pressed="${mode==="aluno"}">Um aluno</button><button data-m="turma" aria-pressed="${mode==="turma"}">Turma inteira</button></div>
<div class="card" style="margin-top:14px">${mode==="aluno"?formAluno():formTurma()}</div>`}
function formAluno(){const last=hist(selStu).slice(-1)[0];
return`<div class="row"><label for="sa">Aluno</label><select id="sa">${students.map(s=>`<option value="${s.id}" ${s.id===selStu?"selected":""}>${s.name} (${clsName(s.classId)})</option>`).join("")}</select></div>
${last?`<p class="mute">Valores iniciais copiados da avaliação de ${dt(last.date)}.</p>`:""}
${CR.map(c=>sliderRow(c,last?last.data[c[0]]:3)).join("")}
<h3 style="margin-top:16px">Pontos fortes</h3><textarea id="st" placeholder="O que o aluno faz bem"></textarea>
<h3 style="margin-top:12px">Pontos a desenvolver</h3><textarea id="td" placeholder="O que trabalhar nas próximas aulas"></textarea>
<div class="row" style="margin-top:14px"><button class="btn" id="save1">Salvar avaliação</button></div>`}
function formTurma(){const c=classes.find(x=>x.id===selCls),ss=students.filter(s=>s.classId===c.id);
return`<div class="row"><label for="sc">Turma</label><select id="sc">${classes.map(x=>`<option value="${x.id}" ${x.id===selCls?"selected":""}>${x.name}</option>`).join("")}</select></div>
<div class="scroll"><table><thead><tr><th>Aluno</th>${CR.map(([,l])=>`<th>${l.slice(0,5)}.</th>`).join("")}</tr></thead><tbody>
${ss.map(s=>{const l=hist(s.id).slice(-1)[0];return`<tr data-s="${s.id}"><td>${s.name}</td>${CR.map(([k,n])=>`<td><input type="number" min="1" max="5" step="0.5" value="${l?l.data[k]:3}" data-k="${k}" aria-label="${n} de ${s.name}"></td>`).join("")}</tr>`}).join("")}</tbody></table></div>
<div class="row" style="margin-top:14px"><button class="btn" id="saveN">Salvar turma</button><span class="mute">Salva ${ss.length} avaliações de uma vez.</span></div>`}
function evolucao(){const h=hist(selStu);if(!h.length)return`<h1>Evolução</h1><div class="row" style="margin-top:14px"><label for="se">Aluno</label><select id="se">${students.map(s=>`<option value="${s.id}" ${s.id===selStu?"selected":""}>${s.name}</option>`).join("")}</select></div><div class="card" style="margin-top:14px"><h2>Sem avaliações</h2><p class="mute">Este aluno ainda não foi avaliado.</p></div>`;
return`<h1>Evolução</h1><p class="sub">Veja o percurso de cada aluno em cada critério.</p>
<div class="row"><label for="se">Aluno</label><select id="se">${students.map(s=>`<option value="${s.id}" ${s.id===selStu?"selected":""}>${s.name} (${clsName(s.classId)})</option>`).join("")}</select></div>
<div class="card" style="margin-top:14px"><div class="chips">${CR.map(([k,l],i)=>`<button class="chip" data-t="${k}" aria-pressed="${!hidden.has(k)}"><i style="background:${COL[i]}"></i>${l}</button>`).join("")}</div>${chart(h)}</div>
<div class="grid g3" style="margin-top:14px">${CR.map(([k,l],i)=>{const v=h.map(e=>e.data[k]),m=v.reduce((a,b)=>a+b,0)/v.length,d=v.length>1?v[v.length-1]-v[v.length-2]:0;
return`<div class="card"><div class="row sp"><h3>${l}</h3>${d?`<span class="tag ${d<0?"down":"up"}">${d>0?"+":""}${fmt(d)}</span>`:""}</div><div class="num" style="color:${COL[i]}">${fmt(v[v.length-1])}</div><div class="mute">média ${fmt(m)} em ${v.length} avaliações</div></div>`}).join("")}</div>
${comp(selStu)}<div class="row" style="margin-top:18px"><button class="btn ghost" id="csv">Exportar CSV</button></div>`}
function chart(h){const W=640,H=280,L=34,R=14,T=12,B=28,x=i=>L+(h.length<2?(W-L-R)/2:i*(W-L-R)/(h.length-1)),y=v=>T+(5-v)*(H-T-B)/4;
let g="";for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
h.forEach((e,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dt(e.date)}</text>`);
CR.forEach(([k,l],i)=>{if(hidden.has(k))return;const p=h.map((e,j)=>`${x(j)},${y(e.data[k])}`).join(" ");
g+=`<polyline points="${p}" fill="none" stroke="${COL[i]}" stroke-width="2.5" stroke-linejoin="round"/>`+h.map((e,j)=>`<circle cx="${x(j)}" cy="${y(e.data[k])}" r="3.5" fill="${COL[i]}"><title>${l}: ${fmt(e.data[k])} em ${dt(e.date)}</title></circle>`).join("")});
return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de evolução por critério">${g}</svg>`}
function csv(){const rows=[["aluno","turma","data",...CR.map(c=>c[1]),"media"]];
evals.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const s=students.find(x=>x.id===e.student);rows.push([s.name,clsName(s.classId),e.date,...CR.map(([k])=>e.data[k]),avg(e.data).toFixed(2)])});
const t=rows.map(r=>r.join(";")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="fisicamente.csv";a.click()}
let user=null;const USERS={professor:["Prof. Helena Duarte","Professora de Educação Física"],coordenador:["Marcos Teixeira","Coordenador pedagógico"]};
function entrar(r){user=r;$(".app").classList.remove("out");$("nav").style.display="";$("#who").innerHTML=USERS[r][0]+"<br>"+USERS[r][1]+'<br><a href="#" id="out" style="color:inherit">Sair</a>';
document.querySelectorAll("nav [data-v]").forEach(b=>{const v=b.dataset.v;b.hidden=(r==="coordenador"&&v==="avaliar")||(r==="professor"&&(v==="turmas"||v==="cadturmas"||v==="professores"))});$("#out").onclick=e=>{e.preventDefault();sair()};go("painel")}
function sair(){$("#lg").src=LOGO;user=null;$(".app").classList.add("out");$("nav").style.display="none";$("#main").innerHTML=`<section class="login card"><img class="logo" src="${LOGO}" alt="FísicaMente"><p class="sub">Avaliação física escolar com histórico e evolução de cada aluno.</p><button class="btn" data-r="professor">Entrar como professora</button><button class="btn ghost" data-r="coordenador">Entrar como coordenador</button></section>`;document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>entrar(b.dataset.r))}
function comp(id){if(!hist(id).length)return"";const s=students.find(x=>x.id===id),l=hist(id).slice(-1)[0].data,cl=students.filter(x=>x.classId===s.classId).filter(x=>hist(x.id).length).map(x=>hist(x.id).slice(-1)[0].data);
return`<div class="card" style="margin-top:14px"><h2>Comparação com a turma</h2><p class="mute">Última avaliação de ${s.name} contra a média de ${clsName(s.classId)}. O traço marca a turma.</p>`+CR.map(([k,n],i)=>{const m=cl.reduce((a,d)=>a+d[k],0)/cl.length;return`<div class="crit"><span>${n}</span><div class="bar"><i style="width:${l[k]*20}%;background:${COL[i]}"></i><u style="left:${m*20}%"></u></div><b>${fmt(l[k])}</b></div>`}).join("")+`</div>`}
function turmas(){return`<h1>Visão geral</h1><p class="sub">Médias por turma na avaliação mais recente de cada aluno.</p><div class="grid g2">`+classes.map(c=>{const ss=students.filter(s=>s.classId===c.id),L=ss.filter(s=>hist(s.id).length).map(s=>hist(s.id).slice(-1)[0].data),ma=k=>L.reduce((a,d)=>a+d[k],0)/(L.length||1),lv=[0,0,0];L.forEach(d=>{const a=avg(d);lv[a<3?0:a<4?1:2]++});
return`<div class="card"><h2>${c.name}</h2><p class="mute">${ss.length} alunos. Abaixo da média: ${lv[0]}. Na média: ${lv[1]}. Acima: ${lv[2]}.</p>`+CR.map(([k,l],i)=>`<div class="crit"><span>${l}</span><div class="bar"><i style="width:${ma(k)*20}%;background:${COL[i]}"></i></div><b>${fmt(ma(k))}</b></div>`).join("")+`</div>`}).join("")+`</div><div class="row" style="margin-top:18px"><button class="btn ghost" id="csv">Exportar CSV</button></div>`}
function relatorio(){const s=students.find(x=>x.id===selStu),h=hist(s.id),o=h.slice().reverse().find(e=>e.strengths||e.toDevelop);
return`<h1 class="noprint">Relatório</h1><p class="sub noprint">Ficha individual para reunião com a família.</p><div class="row noprint"><label for="sr">Aluno</label><select id="sr">${students.map(x=>`<option value="${x.id}" ${x.id===selStu?"selected":""}>${x.name} (${clsName(x.classId)})</option>`).join("")}</select><button class="btn" id="print">Salvar como PDF</button></div>
<div class="card" style="margin-top:14px"><div class="row sp"><h2>FísicaMente</h2><span class="mute">Emitido em 17/10/2026</span></div><h2 style="margin-top:12px">${s.name}</h2><p class="mute">${clsName(s.classId)}, professora Helena Duarte</p>
<div class="scroll"><table><thead><tr><th>Critério</th>${h.map(e=>`<th>${dt(e.date)}</th>`).join("")}</tr></thead><tbody>${CR.map(([k,l])=>`<tr><td>${l}</td>${h.map(e=>`<td>${fmt(e.data[k])}</td>`).join("")}</tr>`).join("")}<tr><td><b>Média</b></td>${h.map(e=>`<td><b>${fmt(avg(e.data))}</b></td>`).join("")}</tr></tbody></table></div>
<h3 style="margin-top:14px">Pontos fortes</h3><p>${o&&o.strengths||"Sem observações registradas."}</p><h3>Pontos a desenvolver</h3><p>${o&&o.toDevelop||"Sem observações registradas."}</p></div>`}

function dlg(title,fields,onSave,ok="Salvar"){const d=document.createElement("dialog");d.innerHTML=`<h2>${title}</h2>`+fields.map(f=>`<label class="fl">${f.l}${f.s?`<select name="${f.n}">${f.s.map(o=>`<option value="${o[0]}" ${o[0]==f.v?"selected":""}>${o[1]}</option>`).join("")}</select>`:`<input name="${f.n}" type="${f.t||"text"}" value="${f.v??""}">`}</label>`).join("")+`<div class="row" style="margin-top:18px"><button class="btn" data-ok>${ok}</button><button class="btn ghost" data-no>Cancelar</button></div>`;
document.body.append(d);d.showModal();const x=()=>{d.close();d.remove()};d.querySelector("[data-no]").onclick=x;
d.querySelector("[data-ok]").onclick=()=>{const v={};d.querySelectorAll("[name]").forEach(e=>v[e.name]=e.value.trim());const miss=fields.find(f=>f.req&&!v[f.n]);if(miss){toast("Preencha: "+miss.l);return}onSave(v);x()}}
function alunos(){const t=qs.toLowerCase(),ss=students.filter(s=>(s.name+clsName(s.classId)).toLowerCase().includes(t));
return`<div class="row sp"><div><h1>Alunos</h1><p class="sub">${students.length} alunos cadastrados em ${classes.length} turmas.</p></div><button class="btn" id="novoA">Novo aluno</button></div>
<div class="card"><input id="busca" placeholder="Buscar por nome ou turma" value="${qs}" style="width:100%;max-width:340px"><div class="scroll"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Idade</th><th>Responsável</th><th>Situação</th><th></th></tr></thead><tbody>${ss.map(s=>`<tr><td>${s.name}</td><td>${clsName(s.classId)}</td><td>${s.age||"-"}</td><td>${s.guardian||"-"}</td><td><span class="tag ${done(s.id)?"up":""}">${done(s.id)?"Avaliado":"Pendente"}</span></td><td><button class="btn ghost" data-ea="${s.id}">Editar</button> <button class="btn ghost" data-da="${s.id}">Remover</button></td></tr>`).join("")||`<tr><td colspan="6">Nenhum aluno encontrado.</td></tr>`}</tbody></table></div></div>`}
function formA(id){if(!classes.length){toast("Cadastre uma turma antes");return}const s=students.find(x=>x.id===id)||{};
dlg(id?"Editar aluno":"Novo aluno",[{n:"name",l:"Nome completo",v:s.name,req:1},{n:"age",l:"Idade",t:"number",v:s.age},{n:"classId",l:"Turma",v:s.classId,s:classes.map(c=>[c.id,c.name])},{n:"guardian",l:"Responsável",v:s.guardian}],v=>{const a=+v.age||null;if(id)Object.assign(s,v,{age:a});else students.push({id:"s"+(++seq),...v,age:a});toast(id?"Aluno atualizado":"Aluno cadastrado");go("alunos")})}
function cadturmas(){return`<div class="row sp"><div><h1>Turmas</h1><p class="sub">Crie turmas e defina o professor responsável.</p></div><button class="btn" id="novaT">Nova turma</button></div><div class="grid g2">${classes.map(c=>{const n=students.filter(s=>s.classId===c.id).length;return`<div class="card"><div class="row sp"><h2>${c.name}</h2><span class="tag">${n} alunos</span></div><p class="mute">${c.grade||"Sem série"}, prof. ${c.teacher||"não definido"}</p><div class="row"><button class="btn ghost" data-et="${c.id}">Editar</button><button class="btn ghost" data-dt="${c.id}">Excluir</button></div></div>`}).join("")||`<div class="card"><p>Nenhuma turma ainda. Crie a primeira.</p></div>`}</div>`}
function formT(id){const c=classes.find(x=>x.id===id)||{};dlg(id?"Editar turma":"Nova turma",[{n:"name",l:"Nome da turma",v:c.name,req:1},{n:"grade",l:"Série",v:c.grade},{n:"teacher",l:"Professor responsável",v:c.teacher,req:1}],v=>{if(id)Object.assign(c,v);else classes.push({id:"t"+(++seq),students:[],...v});toast(id?"Turma atualizada":"Turma criada");go("cadturmas")})}
const notes={};
function professores(){const by={};classes.forEach(c=>{const t=c.teacher||"Sem professor";(by[t]=by[t]||[]).push(c)});
const rows=Object.entries(by).map(([t,cs])=>{const ss=students.filter(s=>cs.some(c=>c.id===s.classId)),H=ss.map(s=>hist(s.id)).filter(h=>h.length),L=H.map(h=>h[h.length-1].data),F=H.map(h=>h[0].data),n=L.length||1,
ma=(A,k)=>A.reduce((a,d)=>a+d[k],0)/n,mt=A=>A.reduce((a,d)=>a+avg(d),0)/n,cr=CR.map(([k,l])=>[l,ma(L,k),k]).sort((a,b)=>b[1]-a[1]);
return{t,cs,ss,has:L.length>0,m:mt(L),g:mt(L)-mt(F),cov:ss.length?Math.round(ss.filter(s=>done(s.id)).length/ss.length*100):0,best:cr[0],worst:cr[cr.length-1],ma:k=>ma(L,k)}}).sort((a,b)=>b.m-a.m);
return`<h1>Professores</h1><p class="sub">Resultados dos alunos de cada professor, da maior média para a menor. Use como apoio à conversa, já que o perfil de cada turma influencia os números.</p><div class="grid g2">`+rows.map(r=>`<div class="card"><div class="row sp"><h2>${r.t}</h2><span class="tag">${r.ss.length} alunos</span></div><p class="mute">${r.cs.map(c=>c.name).join(", ")}</p>
${r.has?`<div class="grid g3" style="margin:12px 0"><div><div class="num">${fmt(r.m)}</div><div class="mute">média dos alunos</div></div><div><div class="num" style="color:${r.g<0?"var(--alert)":"#1B8A5A"}">${r.g>=0?"+":""}${fmt(r.g)}</div><div class="mute">evolução desde o início</div></div><div><div class="num">${r.cov}%</div><div class="mute">avaliados em outubro</div></div></div>
${CR.map(([k,l],i)=>`<div class="crit"><span>${l}</span><div class="bar"><i style="width:${r.ma(k)*20}%;background:${COL[i]}"></i></div><b>${fmt(r.ma(k))}</b></div>`).join("")}
<p>Ponto forte: <b>${r.best[0]}</b> (${fmt(r.best[1])}). Ponto de atenção: <b>${r.worst[0]}</b> (${fmt(r.worst[1])}).</p>`:`<p class="mute">Ainda sem avaliações nas turmas deste professor.</p>`}
${notes[r.t]?`<p class="card" style="background:var(--bg)">${notes[r.t]}</p>`:""}<button class="btn ghost" data-pn="${r.t}">${notes[r.t]?"Editar observação":"Registrar observação"}</button></div>`).join("")+`</div>`}
function bind(){const m=$("#main"),B=(s,f)=>m.querySelectorAll(s).forEach(b=>b.onclick=()=>f(b.dataset));
B("[data-pn]",d=>dlg("Observação sobre "+d.pn,[{n:"txt",l:"Anotação do coordenador",v:notes[d.pn]}],v=>{notes[d.pn]=v.txt;toast("Observação salva");go("professores")}));B("[data-ea]",d=>formA(d.ea));B("[data-et]",d=>formT(d.et));
B("[data-da]",d=>{const s=students.find(x=>x.id===d.da);dlg("Remover "+s.name+"?",[],()=>{students.splice(students.indexOf(s),1);evals=evals.filter(e=>e.student!==s.id);if(selStu===s.id)selStu=(students[0]||{}).id;toast("Aluno removido");go("alunos")},"Remover")});
B("[data-dt]",d=>{const c=classes.find(x=>x.id===d.dt);if(students.some(s=>s.classId===c.id)){toast("Mova os alunos desta turma antes de excluir");return}dlg("Excluir "+c.name+"?",[],()=>{classes.splice(classes.indexOf(c),1);selCls=(classes[0]||{}).id;toast("Turma excluída");go("cadturmas")},"Excluir")});
if($("#novoA"))$("#novoA").onclick=()=>formA();if($("#novaT"))$("#novaT").onclick=()=>formT();if($("#busca"))$("#busca").onchange=e=>{qs=e.target.value;go("alunos")};
m.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{selStu=b.dataset.ev;mode="aluno";go("avaliar")});
m.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{selStu=b.dataset.ch;go("evolucao")});
m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;go("avaliar")});
m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const k=b.dataset.t;hidden.has(k)?hidden.delete(k):hidden.add(k);go("evolucao")});
m.querySelectorAll(".crit input").forEach(i=>i.oninput=()=>$("#o_"+i.dataset.k).textContent=fmt(+i.value));
const q=(id,f)=>{const e=$(id);if(e)e.onchange=()=>f(e.value)};
q("#sa",v=>{selStu=v;go("avaliar")});q("#sc",v=>{selCls=v;go("avaliar")});q("#se",v=>{selStu=v;go("evolucao")});q("#sr",v=>{selStu=v;go("relatorio")});
if($("#csv"))$("#csv").onclick=csv;if($("#print"))$("#print").onclick=()=>print();
if($("#save1"))$("#save1").onclick=()=>{const d={};m.querySelectorAll(".crit input").forEach(i=>d[i.dataset.k]=+i.value);
evals.push({student:selStu,date:TODAY,data:d,strengths:$("#st").value,toDevelop:$("#td").value});toast("Avaliação salva para "+stuName(selStu));go("painel")};
if($("#saveN"))$("#saveN").onclick=()=>{let n=0;m.querySelectorAll("tbody tr").forEach(tr=>{const d={};tr.querySelectorAll("input").forEach(i=>d[i.dataset.k]=Math.min(5,Math.max(1,+i.value||1)));
evals.push({student:tr.dataset.s,date:TODAY,data:d,strengths:"",toDevelop:""});n++});toast(n+" avaliações salvas");go("painel")}}
document.querySelectorAll("nav button[data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
sair();
</script>
</body>
